name: Lint for accessibility issues

on: [pull_request]

# Note: The axe-linter may have issues with Next.js route groups (directories with parentheses).
# If this causes problems, you may need to handle these files separately or use a different accessibility testing approach.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Temporarily rename directories with parentheses
      - name: Rename directories for linting
        run: |
          mv "src/app/(main)" "src/app/main_temp"
          mv "src/app/(sanity)" "src/app/sanity_temp"

      # Run axe-linter
      - uses: dequelabs/axe-linter-action@v1
        with:
          api_key: ${{ secrets.AXE_LINTER_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Restore original directory names
      - name: Restore directory names
        if: always() # Run even if previous steps fail
        run: |
          mv "src/app/main_temp" "src/app/(main)"
          mv "src/app/sanity_temp" "src/app/(sanity)"
