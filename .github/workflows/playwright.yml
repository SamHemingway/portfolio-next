name: Playwright Tests
on: deployment_status

# Cancel in-progress runs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Event
        env:
          EVENT_CONTEXT: ${{ toJSON(github.event) }}
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Deployment Status: ${{ github.event.deployment_status.state }}"
          echo "Target URL: ${{ github.event.deployment_status.target_url }}"
          echo "Environment: ${{ github.event.deployment.environment }}"
          echo "Ref: ${{ github.event.deployment.ref }}"
          echo "SHA: ${{ github.event.deployment.sha }}"
          echo "Full Event Context:"
          echo "$EVENT_CONTEXT"

  test:
    needs: debug
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.target_url, 'vercel.app') &&
      contains(github.event.deployment.environment, 'Preview')
    steps:
    - name: Debug Test Job Conditions
      run: |
        echo "Checking test job conditions:"
        echo "Event name matches? ${{ github.event_name == 'deployment_status' }}"
        echo "Status is success? ${{ github.event.deployment_status.state == 'success' }}"
        echo "URL contains vercel.app? ${{ contains(github.event.deployment_status.target_url, 'vercel.app') }}"
        echo "Environment contains Preview? ${{ contains(github.event.deployment.environment, 'Preview') }}"
    
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.deployment.ref }}
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      run: |
        echo "Testing against deployment URL: ${{ github.event.deployment_status.target_url }}"
        echo "Using ref: ${{ github.event.deployment.ref }}"
        pnpm exec playwright test
      env:
        VERCEL_URL: ${{ github.event.deployment_status.target_url }}
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
        NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
        SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        CI: true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Report Status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const script = require('./.github/workflows/report-status.js')
          await script({github, context, core})
