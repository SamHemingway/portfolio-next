name: Playwright Tests
on: [pull_request, deployment_status]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'deployment_status' && 
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.deployment.ref }}
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install -g pnpm && pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Run Playwright tests
      run: |
        if [ "${{ github.event_name }}" = "deployment_status" ]; then
          DEPLOYMENT_URL=$(echo "${{ github.event.deployment_status.target_url }}" | sed 's#https://##')
          export VERCEL_URL="$DEPLOYMENT_URL"
        else
          echo "Running against localhost as this is a PR trigger"
          pnpm run dev & sleep 10
          export VERCEL_URL="localhost:3000"
        fi
        pnpm exec playwright test
      env:
        VERCEL_URL: ${{ github.event.deployment_status.target_url }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Report Status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const script = require('./.github/workflows/report-status.js')
          await script({github, context, core})
